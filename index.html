<!DOCTYPE html>

<head>

<meta name="twitter:title" content="Highway Blaze 3D — Cinematic Highway Racing">
<meta name="twitter:description" content="Six highway worlds, near-miss combos, wrong-way bonuses, checkpoint gates and the speed bomb. Play free on pipygames.com.">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#141210">
<link rel="stylesheet" href="styles.css">
<script src="https://pipygames.com/sdk/pipysdk.min.js" data-app-id="highway-blaze-3d" defer></script>
<script defer>
  // three.module.js（本地 ESM）→ window.THREE，就绪后再按序加载业务模块（无打包器）
  window.addEventListener('DOMContentLoaded', async () => {
    const boot = (p) => { const f = document.getElementById('boot-pct'); if (f) f.style.width = p + '%'; };
    try {
      boot(30);
      const mod = await import('./lib/three.module.js');
      window.THREE = mod;
      boot(55);
    } catch (e) { console.error('THREE load failed', e); return; }
    const files = ['config/game.config.js', 'config/levels.js', 'config/locales.js',
      'config/domains.config.js', 'config/sdk.config.js', 'config/ads.config.js',
      'src/core/i18n.js', 'src/core/storage.js', 'src/core/domainlock.js', 'src/core/ads.js',
      'src/sdk/pipysdk.js', 'src/core/audio.js',
      'src/art/scene.js', 'src/art/vehicles.js', 'src/art/effects.js',
      'src/ui/ui.js', 'src/game/main.js'];
    for (const src of files) {
      await new Promise(res => {
        const s = document.createElement('script');
        s.src = src; s.onload = res; s.onerror = res;
        document.body.appendChild(s);
      });
    }
    boot(92);
  });
</script>
</head>
<body>
  <div id="app" class="landscape">
    <!-- 3D 画布 -->
    <canvas id="game-canvas"></canvas>

    <!-- 开屏进度 -->
    <div id="boot" class="boot show">
      <div class="boot-title">HIGHWAY BLAZE 3D</div>
      <div class="boot-bar"><div id="boot-pct" class="boot-fill" style="width:8%"></div></div>
      <div class="boot-label">LOADING</div>
    </div>

    <!-- 主菜单 -->
    <div id="menu" class="screen menu">
      <header class="menu-top">
        <div class="brand">
          <h1 class="brand-title">HIGHWAY BLAZE 3D</h1>
          <p class="brand-sub" data-i18n="menu.subtitle">Cinematic Highway Racing</p>
        </div>
        <div class="coin-pill" id="coin-pill">
          <span class="coin-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 7.5v9M9.5 10c0-1.4 1-2.2 2.5-2.2s2.5.7 2.5 2c0 2.6-5 1.9-5 4.3 0 1.3 1 2.1 2.5 2.1s2.5-.8 2.5-2.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
          <b id="menu-coins-v">0</b>
        </div>
        <button id="btn-sound" class="btn-ghost" type="button"></button>
      </header>
      <div class="menu-head">
        <h2 class="menu-head-title" data-i18n="menu.selectLevel">SELECT STAGE</h2>
      </div>
      <div id="level-list" class="lv-list"></div>
    </div>

    <!-- HUD -->
    <div id="hud" class="screen">
      <div class="hud-tl">
        <div class="hud-cell score"><label data-i18n="hud.score">SCORE</label><b id="hud-score">0</b></div>
        <div class="hud-cell combo" id="hud-combo"><label data-i18n="hud.combo">COMBO</label><b id="hud-combo-v">x2</b></div>
      </div>
      <div class="hud-tc">
        <div class="hud-cell dist"><b id="hud-dist">0 / 1500 m</b></div>
        <div class="hud-cell time hidden" id="hud-time"><span class="ico" id="hud-time-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9v4l3 2M9 2h6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span><b id="hud-time-v">34</b></div>
      </div>
      <div class="hud-flags" id="hud-flags">
        <span id="flag-wrong" class="flag wrong" data-i18n="hud.wrongway">WRONG WAY</span>
        <span id="flag-high" class="flag high" data-i18n="hud.highspeed">HIGH SPEED</span>
      </div>
      <div class="hud-bl">
        <div class="speedo">
          <b id="hud-kmh">0</b><span class="unit" id="hud-kmh-unit">KM/H</span>
        </div>
        <div class="nitro" id="hud-nitro">
          <label data-i18n="hud.nitro">NITRO</label>
          <div class="bar"><div id="hud-nitro-bar" class="fill"></div></div>
        </div>
        <div class="bomb hidden" id="hud-bomb">
          <span class="ico" id="hud-bomb-lamp"><svg viewBox="0 0 24 24"><circle cx="11" cy="14" r="7" fill="currentColor"/><path d="M15.5 8.5 18 6m1.5-1.5L21 3m-2 3 1.5.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span>
          <div class="bar"><div id="hud-bomb-bar" class="fill"></div></div>
        </div>
      </div>
      <div class="hud-br">
        <button id="btn-assist" class="btn-ad hidden" type="button"></button>
        <button id="btn-camera" class="btn-round" type="button"></button>
        <button id="btn-nitro" class="btn-round big" type="button"></button>
        <button id="btn-pause" class="btn-round" type="button"></button>
      </div>
      <div id="pop-layer" class="pop-layer"></div>
      <div id="gate-flash" class="gate-flash"></div>
      <div id="tutorial" class="tutorial"></div>
    </div>

    <!-- 暂停 -->
    <div id="panel-pause" class="screen panel">
      <div class="card">
        <h3 data-i18n="pause.title">GAME PAUSED</h3>
        <button id="p-resume" class="btn btn-primary" type="button" data-i18n="pause.resume">RESUME</button>
        <button id="p-restart" class="btn btn-sec" type="button" data-i18n="pause.restart">RESTART</button>
        <button id="p-menu" class="btn btn-sec" type="button" data-i18n="pause.menu">MAIN MENU</button>
      </div>
    </div>

    <!-- 失败（revive 独占入口） -->
    <div id="panel-over" class="screen panel">
      <div class="card">
        <h3 id="over-title">WRECKED</h3>
        <div class="stat-row"><span data-i18n="over.score">YOUR SCORE</span><b id="over-score">0</b></div>
        <div class="stat-row"><span data-i18n="over.best">BEST SCORE</span><b id="over-best">0</b></div>
        <div class="stat-row"><span data-i18n="hud.nearmiss">NEAR MISS</span><b id="over-nearmiss">0</b></div>
        <button id="over-revive" class="btn btn-ad hidden" type="button"></button>
        <button id="over-restart" class="btn btn-primary" type="button" data-i18n="over.restart">RESTART</button>
        <button id="over-menu" class="btn btn-sec" type="button" data-i18n="over.menu">MAIN MENU</button>
      </div>
    </div>

    <!-- 过关 -->
    <div id="panel-clear" class="screen panel">
      <div class="card">
        <h3 class="gold" data-i18n="clear.title">STAGE CLEAR</h3>
        <div class="stat-row"><span data-i18n="over.score">YOUR SCORE</span><b id="clear-score">0</b></div>
        <div class="stat-row"><span data-i18n="over.best">BEST SCORE</span><b id="clear-best">0</b></div>
        <div class="stat-row coinline"><span data-i18n="clear.coins">COINS</span><b id="clear-coins">+0</b></div>
        <button id="clear-double" class="btn btn-ad hidden" type="button"></button>
        <button id="clear-next" class="btn btn-primary" type="button" data-i18n="clear.next">NEXT STAGE</button>
        <button id="clear-replay" class="btn btn-sec" type="button" data-i18n="clear.replay">REPLAY</button>
        <button id="clear-menu" class="btn btn-sec" type="button" data-i18n="clear.menu">MAIN MENU</button>
      </div>
    </div>

    <div id="toast" class="toast"></div>
    <div id="portrait-mask" class="portrait-mask">
      <div class="pm-icon"><svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="5.5" y="10.5" width="4.5" height="4" fill="currentColor"/></svg></div>
      <p>ROTATE YOUR DEVICE<br><span>横屏游玩体验更佳</span></p>
    </div>
  </div>

  <script defer>
    // 开屏真进度：模块脚本逐个落盘时递增
    (function () {
      let pct = 8;
      const tick = setInterval(() => {
        pct = Math.min(96, pct + 4);
        const f = document.getElementById('boot-pct');
        if (f) f.style.width = pct + '%';
      }, 90);
      window.__bootDone = function () {
        clearInterval(tick);
        const f = document.getElementById('boot-pct');
        if (f) f.style.width = '100%';
        setTimeout(() => { const b = document.getElementById('boot'); if (b) b.classList.remove('show'); }, 320);
      };
    })();
  </script>
</body>
</html>
